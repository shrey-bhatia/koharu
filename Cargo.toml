[workspace]
members = ["comic-text-detector", "lama", "manga-ocr", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.11"
edition = "2024"
description = "Manga translator"
license-file = "LICENSE"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 4  # Balance between optimization and compile speed (was 1).
lto = "thin"       # Thin LTO: parallelizable, ~95% of fat LTO benefit, much faster linking.
opt-level = 3      # Maximum speed — critical for ML inference (ONNX, CUDA).
panic = "abort"    # Higher performance by disabling panic handlers.
strip = true       # Ensures debug symbols are removed.

# Fast dev builds - skip LTO entirely for quick iteration
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1

[workspace.dependencies]
candle-transformers = "0.9.1"
hf-hub = "0.4.2"
image = "0.25.6"
ort = "=2.0.0-rc.10"
anyhow = "1.0.98"
ndarray = "0.16.1"
imageproc = "0.25.0"
clap = { version = "4.5.38", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-fs = "2"
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.44.2", features = ["full"] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
log = "0.4.27"
font-kit = "0.14.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
